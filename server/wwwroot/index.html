<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>homefront</title>
  <meta name="description" content="Lights, TV, media and the HTPC in one place.">
  <meta name="theme-color" content="#0f1726" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3f6fa" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
  <script type="importmap">
    { "imports": { "preact": "/vendor/preact.mjs", "preact/hooks": "/vendor/hooks.mjs", "htm": "/vendor/htm.mjs" } }

  <script>
    try { const t = localStorage.getItem('hf-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>

  <div id="app"></div>
  <noscript>homefront needs JavaScript turned on.</noscript>
  <script type="module" src="/js/app.mjs"></script>
